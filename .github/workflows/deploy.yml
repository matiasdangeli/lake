name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lo mínimo que necesita Pages para publicar desde Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si llega otro push, el anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # El repo se llama "lake", así que el sitio vive en /lake/.
  BASE_PATH: /lake/
  # Playwright sólo se usa para el e2e local; en CI no bajamos navegadores.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + tests + build. Si algo falla, no se publica nada.
      - run: npm run verify

      # enablement: activa Pages solo la primera vez, sin tocar la configuración.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
